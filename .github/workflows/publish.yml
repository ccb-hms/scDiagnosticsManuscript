name: Publish Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --------------------- R Setup with Caching ---------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-R-4.4.1-${{ hashFiles('**/*.R') }}
          restore-keys: |
            ${{ runner.os }}-R-4.4.1-

      - name: Install R Dependencies
        run: |
          R -e "install.packages('BiocManager')"
          R -e "BiocManager::install(c('scDiagnostics', 'SpatialExperiment', 'SingleCellExperiment', 'scran', 'scater', 'MerfishData', 'BiocParallel', 'Matrix'))"
        shell: bash

      # --------------------- Python Setup with Caching ---------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.13.3-${{ hashFiles('**/requirements.txt', '.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.13.3-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scanpy celltypist numpy

      # --------------------- Quarto Setup and Render ---------------------
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Website
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: website

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4