# This is the workflow for building and deploying the Quarto website.
name: Publish Website

on:
  push:
    branches: [main] # Trigger the build on pushes to the main branch
  pull_request:
    branches: [main] # Also build on pull requests to check for errors

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # Allow the job to write to GitHub Pages
      id-token: write   # Allow the job to authenticate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --------------------- R Setup ---------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1' # Or your desired R version

      - name: Set up R package cache
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages:
            any::biocmanager
            any::remotes

      - name: Install R (Bioconductor) Dependencies
        run: |
          R -e "BiocManager::install(c('scDiagnostics', 'SpatialExperiment', 'SingleCellExperiment', 'scran', 'scater', 'MerfishData', 'BiocParallel', 'Matrix'))"
        shell: bash

      # --------------------- Python Setup ---------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.3' 

      - name: Set up Python package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # --------------------- Quarto Render and Deploy ---------------------
      - name: Set up Quarto
        uses: quarto-dev/quarto-cli-setup@v2

      - name: Render Website
        uses: quarto-dev/quarto-cli-action-render@v2
        with:
          # Tell Quarto where your website source files are
          path: website 

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This should match the output-dir in _quarto.yml
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4