# .github/workflows/publish.yml
name: Publish Website

on:
  push:
    branches: [main] # Trigger the build on pushes to the main branch
  pull_request:
    branches: [main] # Also build on pull requests to check for errors

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # Allow the job to write to GitHub Pages
      id-token: write   # Allow the job to authenticate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-cli-setup@v2

      # Note: If your .qmd files require R or Python to render,
      # you will need to add setup steps here.
      # - name: Setup R
      #   uses: r-lib/actions/setup-r@v2
      #
      # - name: Setup Python
      #   uses: actions/setup-python@v5

      - name: Render website
        uses: quarto-dev/quarto-cli-action-render@v2
        with:
          # CRITICAL: Tell Quarto where your website source files are
          path: website 

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4